<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ShopEase</h1>
    <div class="cart">
        🛒 <span id="cart-count">0</span> items | ₹<span id="total">0</span>
    </div>
</header>

<section class="hero">
    <h2>Discover Amazing Products</h2>
    <p>Best quality at the best price</p>
</section>

<section class="products">
    <div class="product">
        <img src=" https://cdn.mos.cms.futurecdn.net/Gy3mKpvtHjBJJ2MgstvHE9.jpg" alt="">
        <h3>Headphones</h3>
        <p class="price">₹2,999</p>
        <button onclick="addToCart(2999)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="">
        <h3>Smart Phone</h3>
        <p class="price">₹1,999</p>
        <button onclick="addToCart(1999)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="">
        <h3>Smart Watche</h3>
        <p class="price">₹18,999</p>
        <button onclick="addToCart(18999)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="">
        <h3>Sneakers</h3>
        <p class="price">₹3,499</p>
        <button onclick="addToCart(3499)">Add to Cart</button>
    </div>
</section>

<footer>
    <p>© 2026 ShopEase | Designed with ❤️</p>
</footer>

<script src="script.js"></script>
</body>
</html>
